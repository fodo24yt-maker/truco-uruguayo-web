distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.3-all.zip
# La huella oficial de esa distribución, publicada por Gradle en
# https://downloads.gradle.org/distributions/gradle-8.14.3-all.zip.sha256
#
# Sin esta línea, el wrapper se baja Gradle entero por HTTPS y lo ejecuta sin
# comprobar NADA más allá del certificado. Con ella, si el archivo no es
# exactamente el que Gradle publicó, la compilación se detiene.
#
# Va atada a la versión de arriba: si se sube Gradle, hay que volver a pedir el
# checksum de la versión nueva o el build falla.
distributionSha256Sum=ed1a8d686605fd7c23bdf62c7fc7add1c5b23b2bbc3721e661934ef4a4911d7c
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
